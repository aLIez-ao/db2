# =====================================================================
# SEPOMEX CDMX · Entorno Docker (para quien NO tiene el entorno del equipo)
# Réplica del MySQL 8.0 local: misma versión, mismo charset, mismos datos.
# Uso:
#   cp .env.example .env   # opcional, hay defaults
#   docker compose up -d
#   docker compose logs -f db   # ver carga inicial (espera "seed OK")
#   docker compose down         # apaga (conserva datos en volumen)
#   docker compose down -v      # apaga y BORRA datos
# Conexión: localhost:${MYSQL_PORT:-3307}, BD sepomex, usuario sepomex.
# NOTA: usa 3307 por defecto para no chocar con el MySQL local (3306).
# =====================================================================
services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: sepomex-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sepomex}
      MYSQL_USER: ${MYSQL_USER:-sepomex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sepomex}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_spanish_ci
      - --local-infile=1
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_load.sql:/seed-sql/02_load.sql:ro
      - ./docker/02_seed.sh:/docker-entrypoint-initdb.d/02_seed.sh:ro
      - ./data:/seed:ro
    healthcheck:
      # CMD-SHELL (no exec): el shell del contenedor expande $MYSQL_ROOT_PASSWORD.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dbdata:
    name: sepomex-dbdata
